<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="posicao-imagem-login">

        <div class="imagem-login">
            <img src="Imagens/Heloise-RetratoFinal.png" alt="">
        </div>

        <div class="login">

            <p>BEM-VINDA DE VOLTA</p>
            <h1>Entrar</h1>
            <div class="formulario">

                <div class="input">
                    <label for="ipt_email">E-MAIL</label>
                    <input type="email" id="ipt_email">
                </div>

                <div class="input">
                    <label for="ipt_senha">SENHA</label>
                    <input type="password" id="ipt_senha">
                </div>

                <button>ENTRAR</button>

            </div>


            <div class="row-link">
                <p>Ainda não tem conta?</p> <a href=""> Cadastre-se</a>
            </div>

        </div>

    </div>
</body>

</html>
