<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="stylesheet" href="registro.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            <a href="" class="fonte-cursiva">portrait</a>
        </div>

        <a href="">INÍCIO</a>

        <a href="">FILME</a>
    </header>

    <div class="posicao-imagem-login">

        <div class="imagem-login">
            <img src="Imagens/Marianne-RetratoFinal.png" alt="">
        </div>

        <div class="login">

            <p>FAÇA PARTE DA EXPOSIÇÃO</p>
            <h1>Cadastro</h1>
            <div class="formulario">

                <div class="input">
                    <label for="ipt_nome">NOME</label>
                    <input type="text" id="ipt_nome">
                </div>

                <div class="input">
                    <label for="ipt_email">E-MAIL</label>
                    <input type="email" id="ipt_email">
                </div>

                <div class="input">
                    <label for="ipt_senha">SENHA</label>
                    <input type="password" id="ipt_senha">
                </div>


                <div class="input">
                    <label for="ipt_senha">CONFIRMAR SENHA</label>
                    <input type="password" id="ipt_senha_confirmar">
                </div>


                <button>CRIAR CONTA</button>

            </div>


            <div class="row-link">
                <p>Já possui conta?</p> <a href="login.html"> Entrar</a>
            </div>

        </div>

    </div>
</body>

</html>
